name: Aviso de chuva

# De 5 em 5 minutos, 24h por dia — inclusive de madrugada. Cinco é o MÍNIMO que o
# cron do GitHub aceita.
#
# A cadência é ditada pela fonte RÁPIDA, não pela lenta: o SPECI do aeroporto sai
# no instante em que o tempo muda e chega à API em ~1 min. O pluviômetro do CEMADEN
# leva 15 a 60 min, mas deixar ele mandar no intervalo desperdiçaria a fonte que
# responde rápido.
#
# ⚠️ O agendador do GitHub NÃO é pontual: execuções agendadas entram numa fila e
# costumam atrasar alguns minutos — em pico, podem ser puladas. Isto aqui é o mais
# perto de "imediato" que dá sem um processo ligado o tempo todo, que não existe
# nesta infraestrutura.
#
# ⚠️ Fortaleza chove de fevereiro a maio. De agosto a dezembro este workflow roda e
# corretamente não faz nada. Silêncio aqui é o comportamento certo.
#
# ESTE WORKFLOW SÓ CHAMA UMA ROTA. Quem lê as fontes, decide e envia é o servidor
# (`?route=rain-alert`), igual aos outros três agendados. Antes ele rodava o script
# no próprio runner e mandava o e-mail sozinho — e era o ÚNICO que fazia isso, o que
# exigia as quatro credenciais do Gmail num segundo lugar, num repositório público e
# com rotação em dobro. O estado ("estava chovendo?") saiu do cache do Actions para o
# Firestore pelo mesmo motivo: cache pode ser despejado, e levaria a memória junto.
on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
    inputs:
      simular:
        description: "Forçar um estado para testar o e-mail (chovendo | nao-chovendo)"
        required: false
        default: ""
      forcar:
        # Sem isto, testar duas vezes seguidas com `chovendo` devolve `sem-mudanca` e
        # NÃO manda e-mail — o estado guardado já é `chovendo`. Correto em produção
        # (aviso é de transição, não de condição), confuso num teste: parece que
        # quebrou. Aqui o envio ignora a transição.
        description: "Enviar mesmo sem transição (só para teste)"
        type: boolean
        required: false
        default: false

concurrency:
  # Duas execuções ao mesmo tempo poderiam ler o mesmo estado e mandar dois e-mails.
  group: aviso-de-chuva
  cancel-in-progress: false

jobs:
  vigiar:
    runs-on: ubuntu-latest
    environment: Production
    timeout-minutes: 5
    steps:
      - name: Verificar chuva
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          # A URL do app não é segredo — está no `.env.example` deste repositório
          # público. O secret existe só para o caso de o domínio mudar; sem ele, o
          # padrão vale e nada precisa ser cadastrado.
          RAIN_ALERT_URL: ${{ secrets.RAIN_ALERT_URL || 'https://serv3.vercel.app/api/rain/alert' }}
          SIMULAR: ${{ inputs.simular }}
          FORCAR: ${{ inputs.forcar }}
        run: |
          if [ -z "$CRON_SECRET" ]; then
            echo "Falta o secret CRON_SECRET."
            exit 1
          fi

          URL="$RAIN_ALERT_URL"
          QUERY=""
          if [ -n "$SIMULAR" ]; then
            QUERY="simular=$SIMULAR"
          fi
          if [ "$FORCAR" = "true" ]; then
            QUERY="${QUERY:+$QUERY&}forcar=1"
          fi
          if [ -n "$QUERY" ]; then
            URL="$URL?$QUERY"
          fi

          HTTP_CODE=$(curl -L -sS -o /tmp/rain-response.txt -w "%{http_code}" -X POST "$URL" \
            -H "Authorization: Bearer $CRON_SECRET" \
            -H "Content-Type: application/json")

          cat /tmp/rain-response.txt
          echo ""
          echo "HTTP $HTTP_CODE"

          if [ "$HTTP_CODE" -lt 200 ] || [ "$HTTP_CODE" -ge 300 ]; then
            echo "A rota do aviso de chuva respondeu erro."
            exit 1
          fi
