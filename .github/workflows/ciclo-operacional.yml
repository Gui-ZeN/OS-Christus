name: Ciclo operacional

# OS QUATRO JOBS DE ALTA FREQUÊNCIA NUM AGENDAMENTO SÓ.
#
# ⚠️ POR QUE UNIFICAR. Medido em 19/08, com quatro workflows pedindo `*/5` e
# `*/10` no mesmo repositório, o GitHub entregou:
#
#   Gmail Sync        pedido a cada  5 min → observado a cada ~24 min
#   Email Outbox      pedido a cada  5 min → observado a cada ~29 min
#   Aviso de chuva    pedido a cada  5 min → observado a cada ~32 min
#   Checagem visitas  pedido a cada 10 min → não apareceu em 1h40
#
# Sete execuções por hora somadas, contra trinta e seis pedidas. O agendador do
# GitHub é best-effort e limita POR REPOSITÓRIO: quatro agendamentos disputando a
# mesma cota recebem migalhas cada um. Um só disputa sozinho.
#
# ⚠️ E o ganho maior não é a frequência, é a ORDEM. Antes, a checagem criava o
# e-mail às 07:48 e a fila só era esvaziada às 08:01 — meia hora de espera entre
# gerar a mensagem e mandá-la, sem nada errado no código. Aqui as duas acontecem
# na mesma execução, com segundos entre elas.
#
# ⚠️ ISTO É UMA HIPÓTESE TESTÁVEL, não um fato documentado. O GitHub não publica a
# fórmula do limite. Se em uma semana a cadência continuar em ~30 min, o próximo
# passo é agendador externo — e aí o `CRON_SECRET` sai daqui e vai para um
# terceiro, o que só se faz com um segredo novo.
#
# O disparo MANUAL de cada rota continua onde estava: os quatro workflows antigos
# perderam só o `schedule`, e guardam seus `workflow_dispatch` com as opções de
# simulação. Testar não mudou.

on:
  schedule:
    # Continua pedindo o máximo. O GitHub entrega o que quiser; pedir menos só
    # garantiria menos.
    - cron: "*/5 * * * *"
  workflow_dispatch:

concurrency:
  # Duas execuções juntas leriam o mesmo estado antes de qualquer uma gravar —
  # pergunta em dobro para a sede, dois avisos de chuva. As rotas têm proteção
  # própria (transição, `envioUnico`, reivindicação da fila), mas o agendamento não
  # deve depender só dela.
  group: ciclo-operacional
  cancel-in-progress: false

jobs:
  ciclo:
    runs-on: ubuntu-latest
    environment: Production
    timeout-minutes: 10
    env:
      CRON_SECRET: ${{ secrets.CRON_SECRET }}
    steps:
      - uses: actions/checkout@v4

      # ⚠️ `continue-on-error` em TODOS os quatro, e o veredito no fim.
      #
      # Sem isto, unificar troca quatro falhas independentes por uma cascata: o
      # Gmail fora do ar derrubaria o aviso de chuva e a fila de e-mail junto, e o
      # remédio teria ficado pior que a doença. Cada passo roda sempre; quem falhou
      # aparece no resumo final.

      # A chuva vem primeiro por ser a única em que o minuto conta — e é a mais
      # barata, então não atrasa nada atrás dela.
      - name: Aviso de chuva
        id: chuva
        continue-on-error: true
        run: bash scripts/ci/chamar-rota.sh "Aviso de chuva" "${{ secrets.RAIN_ALERT_URL || format('{0}/api/mail?route=rain-alert', vars.APP_BASE_URL || 'https://serv3.vercel.app') }}"

      # Depois a entrada: e-mail que chegou vira OS.
      - name: Gmail Sync
        id: gmail
        continue-on-error: true
        run: bash scripts/ci/chamar-rota.sh "Gmail Sync" "${{ secrets.SYNC_URL || format('{0}/api/mail?route=gmail-sync', vars.APP_BASE_URL || 'https://serv3.vercel.app') }}"

      # Então o que GERA mensagem: pergunta à sede e alerta de falta.
      - name: Checagem das visitas
        id: checagem
        continue-on-error: true
        run: bash scripts/ci/chamar-rota.sh "Checagem das visitas" "${{ secrets.CHECAGEM_VISITAS_URL || format('{0}/api/mail?route=checagem-visitas', vars.APP_BASE_URL || 'https://serv3.vercel.app') }}"

      # E por último a fila — que agora leva junto o que a checagem acabou de criar.
      - name: Email Outbox
        id: outbox
        continue-on-error: true
        run: bash scripts/ci/chamar-rota.sh "Email Outbox" "${{ secrets.OUTBOX_URL || format('{0}/api/mail?route=outbox-worker', vars.APP_BASE_URL || 'https://serv3.vercel.app') }}"

      # Quem falhou aparece aqui, e só aqui o job fica vermelho.
      #
      # ⚠️ `if`, e não `[ ... ] && VAR=...`. O shell padrão do Actions é `bash -e`:
      # a forma com `&&` devolve 1 quando o teste é falso, e o passo morreria no
      # primeiro passo que deu CERTO — vermelho em toda execução saudável.
      - name: Veredito
        env:
          CHUVA: ${{ steps.chuva.outcome }}
          GMAIL: ${{ steps.gmail.outcome }}
          CHECAGEM: ${{ steps.checagem.outcome }}
          OUTBOX: ${{ steps.outbox.outcome }}
        run: |
          FALHOU=""
          for par in "chuva:$CHUVA" "gmail-sync:$GMAIL" "checagem:$CHECAGEM" "outbox:$OUTBOX"; do
            if [ "${par#*:}" = "failure" ]; then
              FALHOU="$FALHOU ${par%%:*}"
            fi
          done

          if [ -n "$FALHOU" ]; then
            echo "Falharam:$FALHOU"
            exit 1
          fi
          echo "As quatro rotas responderam."
