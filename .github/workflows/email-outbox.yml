name: Email Outbox

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

jobs:
  deliver:
    runs-on: ubuntu-latest
    environment: Production
    timeout-minutes: 5
    steps:
      - name: Process pending email deliveries
        env:
          OUTBOX_URL: ${{ secrets.OUTBOX_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$OUTBOX_URL" ] || [ -z "$CRON_SECRET" ]; then
            echo "Missing required secrets: OUTBOX_URL or CRON_SECRET"
            exit 1
          fi

          HTTP_CODE=$(curl -L -sS -o /tmp/outbox-response.txt -w "%{http_code}" -X POST "$OUTBOX_URL" \
            -H "Authorization: Bearer $CRON_SECRET" \
            -H "Content-Type: application/json")

          cat /tmp/outbox-response.txt
          echo "HTTP $HTTP_CODE"

          if [ "$HTTP_CODE" -lt 200 ] || [ "$HTTP_CODE" -ge 300 ]; then
            echo "Outbox endpoint returned non-success status"
            exit 1
          fi
