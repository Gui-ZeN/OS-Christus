name: Email Outbox

# ⚠️ SEM `schedule` DESDE 19/08. O agendamento dos quatro jobs de alta frequência
# vive em `ciclo-operacional.yml`, que os chama em sequência numa execução só — o
# GitHub limita agendamentos POR REPOSITÓRIO, e quatro disputando a mesma cota
# recebiam ~7 execuções por hora somadas contra 36 pedidas.
#
# Este arquivo fica pelo `workflow_dispatch`: é a ferramenta de teste desta rota, com
# as opções que só fazem sentido aqui. Rodar à mão continua igual.
on:
  workflow_dispatch:

jobs:
  deliver:
    runs-on: ubuntu-latest
    environment: Production
    timeout-minutes: 5
    steps:
      - name: Process pending email deliveries
        env:
          # A URL não é segredo — está no `.env.example` deste repositório PÚBLICO. Ela
          # ser um secret obrigatório é o que provavelmente deixou 81 avisos de "OS
          # nova" parados desde 28/07 com `attempts: 0`: sem o secret o job morre na
          # linha 1, o worker nunca é chamado, e o vermelho de 5 em 5 minutos vira
          # paisagem. O `gmail-sync`, com a mesma estrutura, roda — então o
          # `CRON_SECRET` existe e a diferença está aqui.
          OUTBOX_URL: ${{ secrets.OUTBOX_URL || 'https://serv3.vercel.app/api/email/outbox-worker' }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          echo "Chamando: $OUTBOX_URL"
          if [ -z "$CRON_SECRET" ]; then
            echo "Falta o secret CRON_SECRET."
            exit 1
          fi

          HTTP_CODE=$(curl -L -sS -o /tmp/outbox-response.txt -w "%{http_code}" -X POST "$OUTBOX_URL" \
            -H "Authorization: Bearer $CRON_SECRET" \
            -H "Content-Type: application/json")

          cat /tmp/outbox-response.txt
          echo "HTTP $HTTP_CODE"

          if [ "$HTTP_CODE" -lt 200 ] || [ "$HTTP_CODE" -ge 300 ]; then
            echo "Outbox endpoint returned non-success status"
            exit 1
          fi
